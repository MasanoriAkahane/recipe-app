# ===================================================
# アプリケーション基本設定
# ===================================================
spring.application.name=recipe-manager
server.port=8080

# ===================================================
# H2 データベース永続化設定（ファイルモード）
# ===================================================
spring.datasource.url=jdbc:h2:file:./data/recipedb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================================================
# JPA / Hibernate 設定
# ===================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================
# H2 Console（ブラウザからDBの中身を閲覧・操作する機能）
# ===================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===================================================
# 画像アップロード（MultipartFile）容量上限の緩和
# ===================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================
# Thymeleaf キャッシュ設定（開発環境用）
# ===================================================
spring.thymeleaf.cache=false
