<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レシピ一覧 | My Recipes</title>
  <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
</head>
<body class="recipe-list-page">
  <header class="site-header">
    <a class="site-logo" href="/recipes" th:href="@{/recipes}" aria-label="My Recipes トップへ">
      <span>MY</span>
      <strong>RECIPES</strong>
    </a>

    <nav class="site-nav" aria-label="メインメニュー">
      <a class="nav-link is-current" href="/recipes" th:href="@{/recipes}" aria-current="page">レシピ一覧</a>
      <a class="nav-link" href="#recipe-gallery">レシピを見る</a>
    </nav>

    <a class="add-recipe-button" href="/recipes/new" th:href="@{/recipes/new}">＋ レシピを登録</a>
  </header>

  <main class="page-content" id="recipe-gallery">
    <div class="section-heading">
      <div>
        <p class="section-eyebrow">OUR COOKBOOK</p>
        <h1>お気に入りのレシピ<span class="heading-dot">.</span></h1>
        <p class="section-caption">今日の献立を、ここから。</p>
      </div>
      <p class="recipe-count"><span th:text="${recipes != null ? #lists.size(recipes) : 0}">4</span> 件</p>
    </div>

    <div class="recipe-toolbar" aria-label="レシピの絞り込みと並び替え">
      <div class="category-filters" role="group" aria-label="カテゴリで絞り込み">
        <button type="button" class="category-button is-active">すべて</button>
        <button type="button" class="category-button">主菜</button>
        <button type="button" class="category-button">副菜</button>
        <button type="button" class="category-button">汁物</button>
        <button type="button" class="category-button">その他</button>
      </div>

      <details class="sort-control">
        <summary class="sort-toggle" aria-label="並び替えの項目を表示">
          <svg class="sort-lines" viewBox="0 0 28 28" fill="none" stroke="currentColor"
               stroke-width="2.1" stroke-linecap="round" aria-hidden="true">
            <path d="M3 5h22M3 11h17M3 17h12M3 23h7" />
          </svg>
          <span class="sort-current">並び替え</span>
          <svg class="sort-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m4 6 4 4 4-4" />
          </svg>
        </summary>
        <div class="sort-menu">
          <button type="button" class="sort-option">更新日時：新しい順</button>
          <button type="button" class="sort-option">更新日時：古い順</button>
          <button type="button" class="sort-option">評価：高い順</button>
          <button type="button" class="sort-option">評価：低い順</button>
        </div>
      </details>
    </div>

    <section class="recipe-grid" aria-label="レシピ一覧"
             th:unless="${recipes == null or #lists.isEmpty(recipes)}">
      <article class="recipe-card" th:each="recipe : ${recipes}">
        <div class="recipe-image-wrap">
          <a class="recipe-photo-link" href="/recipes/1"
             th:href="@{/recipes/{id}(id=${recipe.id})}"
             th:aria-label="${recipe.title} + 'の詳細を見る'" aria-label="レシピの詳細を見る">
            <img class="recipe-image" th:if="${recipe.image != null and !recipe.image.isEmpty()}"
                 th:src="${recipe.image}" th:alt="${recipe.title} + 'の写真'" alt="料理の写真">
            <div class="recipe-image-placeholder" th:unless="${recipe.image != null and !recipe.image.isEmpty()}">
              <span class="placeholder-mark" aria-hidden="true">✳</span>
              <span>NO PHOTO</span>
            </div>
            <div class="image-rating" th:aria-label="'お気に入り度 ' + ${recipe.favoriteLevel} + ' / 5'">
              <span class="rating-stars" aria-hidden="true" th:with="level=${recipe.favoriteLevel != null ? recipe.favoriteLevel : 0}">
                <span th:each="star : ${#numbers.sequence(1,5)}"
                      th:classappend="${star <= level} ? 'is-filled' : ''">★</span>
              </span>
            </div>
          </a>
          <a class="recipe-edit-shortcut" href="/recipes/1/edit"
             th:href="@{/recipes/{id}/edit(id=${recipe.id})}"
             th:aria-label="${recipe.title} + 'を編集'" aria-label="レシピを編集" title="レシピを編集">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4L16.5 3.5Z" />
            </svg>
          </a>
        </div>
        <h2 class="recipe-title">
          <a class="recipe-title-link" href="/recipes/1"
             th:href="@{/recipes/{id}(id=${recipe.id})}" th:text="${recipe.title}">料理名</a>
        </h2>
      </article>
    </section>

    <section class="empty-state" th:if="${recipes == null or #lists.isEmpty(recipes)}">
      <p>まだレシピがありません。</p>
      <a href="/recipes/new" th:href="@{/recipes/new}">最初のレシピを登録する</a>
    </section>
  </main>

</body>
</html>
