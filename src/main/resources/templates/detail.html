<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${recipe.title} + ' | Recipe Manager'">Recipe Details | Recipe Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&amp;family=Epunda+Sans:ital,wght@0,300..900;1,300..900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
</head>
<body class="recipe-ui recipe-detail-page">
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-brand" href="/recipes" th:href="@{/recipes}" aria-label="きょうのレシピ：レシピ一覧へ">
        <picture class="site-brand-logo">
          <!-- OS側でアニメーションを減らす設定なら静止画像にする -->
          <source media="(prefers-reduced-motion: reduce)" srcset="/images/logo/kyouno-recipe-still.png" th:srcset="@{/images/logo/kyouno-recipe-still.png}" type="image/png">
          <!-- Edge / Chromeでは画質の良い透過アニメーションを表示 -->
          <source srcset="/images/logo/kyouno-recipe-animated.webp" th:srcset="@{/images/logo/kyouno-recipe-animated.webp}" type="image/webp">
          <img class="site-brand-animation" src="/images/logo/kyouno-recipe-animated.gif" th:src="@{/images/logo/kyouno-recipe-animated.gif}" alt="きょうのレシピ" width="562" height="169">
        </picture>
      </a>
      <a class="header-text-link" href="/recipes" th:href="@{/recipes}">← 一覧に戻る</a>
    </div>
  </header>

  <main class="page-container">
    <nav class="breadcrumb" aria-label="現在の位置"><a href="/recipes" th:href="@{/recipes}">Recipes</a><span aria-hidden="true">/</span><span th:text="${recipe.title}">鮭の塩焼き定食</span></nav>

    <article class="detail-main">
      <div class="detail-image">
        <img th:if="${recipe.image != null and !recipe.image.isEmpty()}" th:src="${recipe.image}" th:alt="${recipe.title}" alt="料理写真" loading="eager" fetchpriority="high" decoding="async">
        <div class="detail-image-empty" th:unless="${recipe.image != null and !recipe.image.isEmpty()}">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 17h44v32H10zM15 17l7-7h20l7 7"/><circle cx="32" cy="32" r="10"/><path d="M17 45l10-9 7 5 8-11 8 15"/></svg>
          <span>写真なし</span>
        </div>
      </div>

      <div class="detail-overview">
        <p class="eyebrow">RECIPE DETAIL</p>
        <span class="detail-category" th:switch="${recipe.category}">
          <span th:case="'主菜'">主菜</span>
          <span th:case="'副菜'">副菜</span>
          <span th:case="'汁物'">汁物</span>
          <span th:case="'その他'">その他</span>
          <span th:case="*" th:text="${recipe.category}">カテゴリ</span>
        </span>
        <h1 th:text="${recipe.title}">鮭の塩焼き定食</h1>
        <div class="detail-rating" th:with="level=${recipe.favoriteLevel != null ? recipe.favoriteLevel : 0}" th:aria-label="'お気に入り度: ' + ${recipe.favoriteLevel} + ' / 5'">
          <span th:each="n : ${#numbers.sequence(1,5)}" th:classappend="${n <= level} ? 'filled' : ''">★</span>
        </div>
        <div class="detail-facts">
          <div><span>カテゴリ</span><strong th:switch="${recipe.category}"><span th:case="'主菜'">主菜</span><span th:case="'副菜'">副菜</span><span th:case="'汁物'">汁物</span><span th:case="'その他'">その他</span><span th:case="*" th:text="${recipe.category}">カテゴリ</span></strong></div>
          <div><span>調理時間</span><strong><span th:text="${recipe.cookingTime}">25</span> 分</strong></div>
          <div th:if="${recipe.servings != null}"><span>人数</span><strong th:text="${recipe.servings} + '人前'">2人前</strong></div>
        </div>
        <div class="detail-toolbar">
          <div class="detail-actions">
            <a class="button button-dark" href="/recipes/1/edit" th:href="@{/recipes/{id}/edit(id=${recipe.id})}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4L16.5 3.5Z"/></svg>
              編集する
            </a>
            <button class="button button-delete" type="button" popovertarget="deleteConfirm" popovertargetaction="show">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v7M14 10v7"/></svg>
              削除する
            </button>
          </div>
          <div id="servingsPanel" class="servings-preview-card" th:if="${recipe.servings != null}"
               data-base-servings="2" th:attr="data-base-servings=${recipe.servings}">
            <label class="servings-preview-label" for="targetServings">材料の人数を変更</label>
            <div class="servings-select-row">
              <select id="targetServings" aria-label="何人前の材料を表示するか">
                <option th:each="n : ${#numbers.sequence(1,10)}" th:value="${n}"
                        th:text="${n} + '人前'" th:selected="${n == recipe.servings}">1人前</option>
              </select>
              <button type="button" id="calculateServings" class="servings-calc-button">材料を計算</button>
            </div>
          </div>
        </div>
      </div>
    </article>

    <div class="detail-body">
      <section class="recipe-content-section" aria-labelledby="ingredients-heading">
        <div class="content-section-heading"><h2 id="ingredients-heading">Ingredients</h2><span id="displayedServings" class="ingredients-servings-label" th:if="${recipe.servings != null}" th:text="${recipe.servings} + '人前'">2人前</span></div>
        <ul class="detail-ingredients" th:if="${ingredientLines != null and !#lists.isEmpty(ingredientLines)}">
          <li th:each="ingredient : ${ingredientLines}" th:text="${ingredient}">生鮭 2切れ</li>
        </ul>
        <p class="detail-empty-text" th:if="${recipe.ingredients == null or recipe.ingredients.isEmpty()}">材料は登録されていません。</p>
      </section>
      <section class="recipe-content-section" aria-labelledby="instructions-heading">
        <div class="content-section-heading"><h2 id="instructions-heading">Directions</h2></div>
        <ol class="detail-directions" th:if="${instructionLines != null and !#lists.isEmpty(instructionLines)}">
          <li th:each="step : ${instructionLines}"><span th:text="${step}">鮭に塩を振る。</span></li>
        </ol>
        <p class="detail-empty-text" th:if="${instructionLines == null or #lists.isEmpty(instructionLines)}">作り方は登録されていません。</p>
      </section>
    </div>
  </main>

  <div id="deleteConfirm" class="recipe-delete-popover" popover="auto" role="dialog" aria-labelledby="deleteTitle" aria-describedby="deleteNote">
    <div class="delete-dialog-symbol" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v7M14 10v7"/></svg>
    </div>
    <p class="eyebrow">DELETE RECIPE</p>
    <h2 id="deleteTitle">「<span th:text="${recipe.title}">レシピ名</span>」を削除しますか？</h2>
    <p id="deleteNote">削除したレシピは元に戻せません。</p>
    <div class="delete-dialog-actions">
      <form method="post" action="/recipes/1/delete" th:action="@{/recipes/{id}/delete(id=${recipe.id})}">
        <button type="submit" class="button button-confirm-delete">削除する</button>
      </form>
      <button type="button" class="button button-cancel-delete" popovertarget="deleteConfirm" popovertargetaction="hide" autofocus>キャンセル</button>
    </div>
  </div>
  <script src="/js/servings.js" th:src="@{/js/servings.js}" defer></script>
</body>
</html>
