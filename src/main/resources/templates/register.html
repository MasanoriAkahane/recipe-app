<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Recipe | Recipe Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&amp;family=Epunda+Sans:ital,wght@0,300..900;1,300..900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
</head>
<body class="recipe-ui recipe-form-page">
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-brand" href="/recipes" th:href="@{/recipes}" aria-label="レシピ一覧へ">
        <span class="site-brand-mark" aria-hidden="true">R<span>.</span></span>
        <span class="site-brand-text">Recipe Manager</span>
      </a>
      <a class="header-text-link" href="/recipes" th:href="@{/recipes}">← 一覧に戻る</a>
    </div>
  </header>

  <main class="page-container form-page-container">
    <div class="form-page-heading">
      <p class="eyebrow">NEW RECIPE</p>
      <h1>Add Recipe</h1>
    </div>

    <form th:action="@{/recipes}" action="/recipes" method="post"
          enctype="multipart/form-data" class="recipe-form-layout" th:object="${recipe}">
      <aside class="form-photo-panel">
        <h2 class="form-panel-title"><span class="panel-number">01</span> Photo</h2>
        <div class="photo-preview-box">
          <img id="imagePreview" alt="選択した料理写真のプレビュー"
                   src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='20' fill='%23f0e6dc'/%3E%3Cpath d='M33 73l17-18 14 13 13-12 17 25H27z' fill='%23b9b7a3'/%3E%3Ccircle cx='79' cy='42' r='8' fill='%23e7a18f'/%3E%3C/svg%3E">
        </div>
        <label class="button-select-photo" for="imageInput">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 7h5l2-3h4l2 3h5v13H3V7Z"/><circle cx="12" cy="13" r="4"/></svg>
          写真を選択
        </label>
        <input class="file-input" type="file" name="imageFile" id="imageInput" accept="image/*" onchange="previewImage(event)">
        <p class="photo-hint">写真はあとから登録・変更できます。</p>
      </aside>

      <div class="form-input-panel">
        <h2 class="form-panel-title"><span class="panel-number">02</span> Recipe Details</h2>
        <p class="form-error-summary" th:if="${#fields.hasErrors('*')}">入力内容に誤りがあります。料理名、調理時間、お気に入り度、人数を確認してください。</p>
        <div class="form-group">
          <label for="title">料理名 <span class="required">*</span></label>
          <input type="text" id="title" th:field="*{title}" placeholder="例：鮭の塩焼き" required maxlength="100">
        </div>
        <div class="form-row-three">
          <div class="form-group">
            <label for="category">カテゴリ</label>
            <select id="category" th:field="*{category}">
              <option value="主菜">主菜</option><option value="副菜">副菜</option>
              <option value="汁物">汁物</option><option value="その他">その他</option>
            </select>
          </div>
          <div class="form-group">
            <label for="cookingTime">調理時間（分）</label>
            <input type="number" id="cookingTime" th:field="*{cookingTime}" min="1" value="15" required>
          </div>
          <div class="form-group">
            <label for="favoriteLevel">お気に入り度</label>
            <select id="favoriteLevel" th:field="*{favoriteLevel}">
              <option value="5">★★★★★</option>
              <option value="4">★★★★☆</option>
              <option value="3" selected>★★★☆☆</option>
              <option value="2">★★☆☆☆</option>
              <option value="1">★☆☆☆☆</option>
            </select>
          </div>
        </div>
        <div class="form-row-servings">
          <div class="form-group">
            <label for="servings">基準人数 <span class="optional-note">任意・1〜10人前</span></label>
            <div class="servings-input-wrap">
              <input type="number" id="servings" th:field="*{servings}" min="1" max="10"
                     placeholder="未入力なら人数表示なし">
              <span class="servings-input-unit">人前</span>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="ingredients">材料 <span class="optional-note">1行に1つずつ入力</span></label>
          <textarea id="ingredients" th:field="*{ingredients}" rows="5"
                    placeholder="鮭 2切れ&#10;塩 少々&#10;大根 適量"></textarea>
        </div>
        <div class="form-group">
          <label for="instructions">作り方 <span class="optional-note">1行に1手順ずつ入力</span></label>
          <textarea id="instructions" th:field="*{instructions}" rows="6"
                    placeholder="鮭に塩を振る&#10;両面を焼く&#10;皿に盛り付ける"></textarea>
        </div>
        <div class="form-actions">
          <a class="pill-button pill-button-secondary" href="/recipes" th:href="@{/recipes}">キャンセル</a>
          <button class="pill-button pill-button-primary" type="submit">登録する</button>
        </div>
      </div>
    </form>
  </main>
  <script>
    function previewImage(event) {
      const input = event.target;
      if (input.files && input.files[0]) {
        const file = input.files[0];
        if (!file.type.startsWith('image/')) {
          alert('画像ファイルを選択してください。');
          return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('imagePreview').src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }
  </script>
</body>
</html>
