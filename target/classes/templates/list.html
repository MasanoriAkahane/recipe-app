<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レシピ一覧 - レシピ管理アプリ</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    body { font-family: 'Yu Gothic', sans-serif; background: #faf7f2; color: #333; margin: 0; padding: 24px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2ddd3; padding-bottom: 12px; margin-bottom: 20px; }
    .header-bar h1 { margin: 0; font-size: 24px; color: #2c3e50; }
    .button-primary { background: #d35400; color: white; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .card { background: #fff; border: 1px solid #e8e2d8; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.04); display: flex; flex-direction: column; }
    .card-img { width: 100%; height: 160px; object-fit: cover; background: #eee; }
    .card-body { padding: 16px; flex: 1; }
    .card-title { font-size: 18px; margin: 0 0 8px; color: #2c3e50; }
    .badge-wrap { margin-bottom: 8px; display: flex; gap: 6px; }
    .badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; background: #f0ebe1; color: #555; }
    .fav-star { color: #e67e22; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header-bar">
    <h1>📖 お気に入りレシピ帳</h1>
    <a th:href="@{/recipes/new}" class="button-primary">+ 新しいレシピを登録</a>
  </div>

  <div class="card-grid">
    <div class="card" th:each="recipe : ${recipes}">
      <img th:if="${recipe.image != null and !recipe.image.isEmpty()}" th:src="${recipe.image}" class="card-img" alt="料理写真">
      <div th:unless="${recipe.image != null and !recipe.image.isEmpty()}" class="card-img" style="display:flex;align-items:center;justify-content:center;color:#999;font-size:13px;">No Image</div>
      <div class="card-body">
        <div class="badge-wrap">
          <span class="badge" th:text="${recipe.category}">主菜</span>
          <span class="badge">⏱ <span th:text="${recipe.cookingTime}">15</span>分</span>
          <span class="badge fav-star">★ <span th:text="${recipe.favoriteLevel}">3</span></span>
        </div>
        <h3 class="card-title" th:text="${recipe.title}">料理名</h3>
        <p style="font-size: 12px; color: #777; white-space: pre-line; margin: 0;" th:text="${recipe.ingredients}">材料</p>
      </div>
    </div>
  </div>
</body>
</html>
